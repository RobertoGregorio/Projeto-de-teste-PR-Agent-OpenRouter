name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  pr-agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}

          config.model: "openrouter/free"
          config.fallback_models: '["openrouter/free"]'

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.extra_instructions: |
            Review this C#/.NET pull request.
            Focus only on real bugs, security issues, performance problems,
            async/await mistakes, EF Core/database issues, dependency
            injection problems, error handling, and obvious architectural
            problems.
            Do not comment on formatting or trivial style preferences.
            Do not make speculative claims.
            Keep the review concise and explain why each finding matters.
